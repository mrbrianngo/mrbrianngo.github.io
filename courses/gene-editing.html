<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gene Editing — Course</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --text-main: #c0c0c0; --text-strong: #ffffff; --text-faint: #666666; --highlight: #ff4f00; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000a00; color: var(--text-main); font-family: "Space Mono", monospace; text-transform: uppercase; padding:36px }
    a { color:#ff4f00; text-decoration:none }
    .title { font-size:20px; font-weight:700; color:#fff; margin-bottom:12px }
    .category { color:var(--text-faint); white-space:pre-line }
    .back { margin-bottom:24px; display:inline-block }

    /* File Grid Styles */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .file-card {
      background: rgba(255, 79, 0, 0.03);
      border: 1px solid #222;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .file-card:hover {
      border-color: #ff4f00;
      background: rgba(255, 79, 0, 0.08);
      transform: translateY(-2px);
    }

    .file-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-name {
      color: var(--text-strong);
      font-size: 12px;
      font-weight: 700;
      word-break: break-all;
    }

    .file-meta {
      color: var(--text-faint);
      font-size: 10px;
    }

    .download-btn {
      color: #ff4f00;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>

  <a class="back" href="../index.html">← Back</a>
  <div class="title">Gene Editing</div>
  
  <section style="margin-bottom: 32px;">
        <div class="download-btn">VIEW FILE ↗</div>
      </a>
    </div>
  </section>

  <hr style="margin:24px 0; border-color:#222">
  <div class="category">BME 195 / Fall Quarter</div>
</body>
</html>
