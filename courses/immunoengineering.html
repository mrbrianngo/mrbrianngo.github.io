<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Immunoengineering — Course</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --text-main: #c0c0c0; --text-strong: #ffffff; --text-faint: #666666; --highlight: #ff4f00; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000a00; color: var(--text-main); font-family: "Space Mono", monospace; text-transform: uppercase; padding:36px }
    a { color:#ff4f00; text-decoration:none }
    .title { font-size:20px; font-weight:700; color:#fff; margin-bottom:12px }
    .category { color:var(--text-faint); white-space:pre-line }
    .back { margin-bottom:24px; display:inline-block }

    /* File and Media Styles */
    .media-section {
      margin-top: 32px;
      margin-bottom: 32px;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border: 1px solid #222;
      margin: 24px 0;
    }

    .video-container video {
      width: 100%;
      height: 100%;
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .file-card {
      background: rgba(255, 79, 0, 0.03);
      border: 1px solid #222;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .file-card:hover {
      border-color: #ff4f00;
      background: rgba(255, 79, 0, 0.08);
      transform: translateY(-2px);
    }

    .file-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-name {
      color: var(--text-strong);
      font-size: 12px;
      font-weight: 700;
      word-break: break-all;
    }

    .file-meta {
      color: var(--text-faint);
      font-size: 10px;
    }

    .download-btn {
      color: #ff4f00;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>

  <a class="back" href="../index.html">← Back</a>
  <div class="title">Immunoengineering</div>
  
  <section class="media-section">
    <div class="title" style="font-size: 16px;">Final Project Presentation</div>
    <div class="video-container">
      <video controls>
        <source src="../Portfolio/BME%20195%20(Immunoengineering)/195-Group7VideoFinal.mp4" type="video/mp4">
      </video>
    </div>
    <div style="font-size: 10px; color: var(--text-faint); margin-top: -12px; margin-bottom: 48px;">Note: Video file size is ~1GB.</div>

    <div class="title" style="font-size: 16px;">Final Paper</div>
    <div class="pdf-container">
      <embed src="../Portfolio/BME%20195%20(Immunoengineering)/195%20Final%20Paper.pdf" type="application/pdf">
    </div>

    <div class="title" style="font-size: 16px; margin-top: 48px;">Supplemental Materials</div>
    <div class="file-grid">
      <a href="../Portfolio/BME%20195%20(Immunoengineering)/195%20Final%20Paper.pdf" target="_blank" class="file-card">
        <div class="file-info">
          <div class="file-name">Final Paper.pdf</div>
          <div class="file-meta">PDF DOCUMENT</div>
        </div>
        <div class="download-btn">VIEW FILE ↗</div>
      </a>

      <a href="../Portfolio/BME%20195%20(Immunoengineering)/Graphic%20Organizer%20grp%207.pdf" target="_blank" class="file-card">
        <div class="file-info">
          <div class="file-name">Graphic Organizer.pdf</div>
          <div class="file-meta">PDF DOCUMENT</div>
        </div>
        <div class="download-btn">VIEW FILE ↗</div>
      </a>
    </div>
  </section>

  <hr style="margin:24px 0; border-color:#222">
  <div class="category">BME 195 / Winter Quarter</div>
</body>
</html>
